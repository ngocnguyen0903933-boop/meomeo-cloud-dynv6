name: Validate and deploy dynv6 Pages

on:
  push:
    branches: [deploy/dynv6]
  pull_request:
    branches: [source-snapshot, deploy/dynv6]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate public tree
        run: node tools/validate.mjs
      - name: Check English content and navigation
        run: node tools/content-check.mjs
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.repository == 'ngocnguyen0903933-boop/meomeo-cloud-dynv6' && github.event_name != 'pull_request' && github.ref == 'refs/heads/deploy/dynv6'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
